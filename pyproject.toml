[project]
name = "moongazer-rl"
version = "0.1.0"
description = "Run Prime Intellect verifiers v1 environments with Unsloth/TRL GRPO."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "verifiers==0.2.0",
  "mcp<2",  # verifiers 0.2.0 needs mcp.server.fastmcp (removed in mcp 2.x)
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "trl>=0.24.0,<0.25",
  "transformers>=5.2,<=5.5.0",  # Trainer._clip_grad_norm / _get_grad_norm used by unsloth-native; unsloth pins <=5.5
  "datasets>=3.4.1,<4.4.0,!=4.0.*,!=4.1.0",
  "torch>=2.4.0,<2.12.0",
  "peft>=0.8.0",
]

[project.optional-dependencies]
unsloth = [
  "unsloth>=2026.9.2 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "ruff>=0.13",
  "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moongazer_rl", "src/null_patient"]

[project.scripts]
mg-rl = "moongazer_rl.cli:main"

[tool.ruff]
line-length = 100
# Verbatim copies of verifiers 0.2.0 files (diff described in their headers); kept byte-close to upstream.
extend-exclude = [
  "src/moongazer_rl/harnesses/null_patient/program.py",
  "src/moongazer_rl/harnesses/null_patient/harness.py",
]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
